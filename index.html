<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中三 Python 編程</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --fg:#1f2430; --muted:#5f6675; --line:#dcd6c8;
  --accent:#2f6fde; --accent-fg:#ffffff; --ok:#1f8f5a;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181f; --card:#1e2330; --fg:#eef0f4; --muted:#a3aab8; --line:#343b4b;
  --accent:#6b9cff; --accent-fg:#0d1526; --ok:#5fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181f; --card:#1e2330; --fg:#eef0f4; --muted:#a3aab8; --line:#343b4b;
  --accent:#6b9cff; --accent-fg:#0d1526; --ok:#5fd39a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.7;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 60px;padding-inline:16px}
h1{font-size:1.9rem;line-height:1.3;margin:0 0 4px;font-weight:900;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 24px}
.list{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.item{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px 16px}
.item.live{border-left-color:var(--ok)}
.item .n{font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.2em}
.item .t{font-weight:700;flex:1 1 220px;min-width:0}
.item .d{color:var(--muted);font-size:.9rem;flex:1 1 100%}
.item a.go{background:var(--accent);color:var(--accent-fg);text-decoration:none;font-weight:700;border-radius:8px;padding:8px 18px;min-height:44px;display:inline-flex;align-items:center}
.item a.go:focus-visible{outline:3px solid #f2c230;outline-offset:2px}
.item .soon{color:var(--muted);font-size:.9rem}
.item.off{opacity:.7}
footer{margin-top:28px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>中三 Python 編程</h1>
  <p class="sub">共 10 堂，每堂 80 分鐘。先估輸出，再執行；每堂都有作品和出口卡。</p>
  <ol class="list" id="list"></ol>
  <footer>進度和分數只儲存在你使用的瀏覽器。完成後下載成績報告交給老師。</footer>
</div>
<script>
/* href 留空 = 準備中 */
const LESSONS=[
  {n:1,t:'由積木到文字',d:'Scratch、Arduino 與 Python 對照；print、input；讀錯誤訊息',href:'lesson1/'},
  {n:2,t:'變量與運算',d:'數據類型、運算符、類型轉換；BMI 計算器、找續計算機',href:''},
  {n:3,t:'程式會判斷',d:'if / elif / else、and / or / not；戲院票價計算器',href:''},
  {n:4,t:'海龜繪圖與 for 迴圈',d:'turtle、range；正方形 → 多邊形 → 自創圖案',href:''},
  {n:5,t:'累加與計數',d:'累加器、計數器；儲蓄複利、乘數表',href:''},
  {n:6,t:'while 迴圈與數據驗證',d:'重複輸入直至有效、random；猜數字遊戲',href:''},
  {n:7,t:'列表與標準算法',d:'列表、最大／最小值、計數；班級成績查詢器',href:''},
  {n:8,t:'字串、除錯與測試',d:'字串處理、三類錯誤、邊界測試；專題規劃表',href:''},
  {n:9,t:'迷你專題（一）',d:'按規劃表編寫',href:''},
  {n:10,t:'迷你專題（二）及選科導航',d:'完成、互評、ICT 高中讀甚麼',href:''}
];
const ol=document.getElementById('list');
LESSONS.forEach(l=>{
  const li=document.createElement('li');
  li.className='item '+(l.href?'live':'off');
  li.innerHTML=`<span class="n">第 ${l.n} 堂</span><span class="t"></span>${l.href?'<a class="go"></a>':'<span class="soon">準備中</span>'}<span class="d"></span>`;
  li.querySelector('.t').textContent=l.t;
  li.querySelector('.d').textContent=l.d;
  if(l.href){const a=li.querySelector('a.go');a.href=l.href;a.textContent='開始';a.setAttribute('aria-label','開始第 '+l.n+' 堂 '+l.t);}
  ol.appendChild(li);
});
</script>
</body>
</html>
